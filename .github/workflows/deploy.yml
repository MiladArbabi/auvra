# .github/workflows/deploy.yml

name: Vercel Production and Preview Deployment

# Controls when the action will run.
# It triggers on pushes to the main branch and on any pull request.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  Deploy-Vercel-Action:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checks out the repository's code so the job can access it.
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Uses the official Vercel GitHub Action to deploy.
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          # This token is a secret you'll add to your GitHub repository.
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          
          # This is the Organization ID from your Vercel account.
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          
          # This is the Project ID from your Vercel project.
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          
          # The GITHUB_TOKEN is automatically provided by GitHub Actions.
          # It's used by the action to post comments on your pull requests with the preview URL.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          
          # If the trigger is a push to the 'main' branch, it will deploy to production.
          # Otherwise, it creates a preview deployment.
          vercel-args: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}